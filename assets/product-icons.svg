<svg xmlns="http://www.w3.org/2000/svg">
  <!-- BlueMind product icons: one friendly outline shape per product, same smile on each.
       Use: <svg class="icon picon"><use href="assets/product-icons.svg#enterprise"/></svg> — colour follows currentColor. -->
  <symbol id="enterprise" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- house: the firm -->
    <path d="M6.5 14.2 15 7.3a1.6 1.6 0 0 1 2 0l8.5 6.9V23.5a2.5 2.5 0 0 1-2.5 2.5H9a2.5 2.5 0 0 1-2.5-2.5Z"/>
    <circle cx="12.7" cy="16.6" r="1.15" fill="currentColor" stroke="none"/>
    <circle cx="19.3" cy="16.6" r="1.15" fill="currentColor" stroke="none"/>
    <path d="M12.6 20.2c1.9 1.9 4.9 1.9 6.8 0"/>
  </symbol>
  <symbol id="advisor" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- speech bubble: the advisor talking with clients -->
    <path d="M16 6c5.5 0 10 4.2 10 9.4s-4.5 9.4-10 9.4c-1.5 0-2.9-.3-4.2-.9L6.5 26l1.6-4.6A9 9 0 0 1 6 15.4C6 10.2 10.5 6 16 6Z"/>
    <circle cx="12.7" cy="14.2" r="1.15" fill="currentColor" stroke="none"/>
    <circle cx="19.3" cy="14.2" r="1.15" fill="currentColor" stroke="none"/>
    <path d="M12.6 17.8c1.9 1.9 4.9 1.9 6.8 0"/>
  </symbol>
  <symbol id="all" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- forward tag: everything moving together -->
    <path d="M8 7.5h11a2 2 0 0 1 1.6.8l5.2 6.5a2 2 0 0 1 0 2.4l-5.2 6.5a2 2 0 0 1-1.6.8H8a1.3 1.3 0 0 1-1.1-2l3.6-5.3a2 2 0 0 0 0-2.4L6.9 9.5a1.3 1.3 0 0 1 1.1-2Z"/>
    <circle cx="14.2" cy="14.4" r="1.15" fill="currentColor" stroke="none"/>
    <circle cx="20" cy="14.4" r="1.15" fill="currentColor" stroke="none"/>
    <path d="M14 18c1.7 1.7 4.4 1.7 6.1 0"/>
  </symbol>
  <symbol id="mia" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- arch "A": the AI assistant -->
    <path d="M8 24.5V14a8 8 0 0 1 16 0v10.5a1.5 1.5 0 0 1-1.5 1.5h-2a1.5 1.5 0 0 1-1.5-1.5V23a3 3 0 0 0-6 0v1.5a1.5 1.5 0 0 1-1.5 1.5h-2A1.5 1.5 0 0 1 8 24.5Z"/>
    <circle cx="13" cy="12.4" r="1.15" fill="currentColor" stroke="none"/>
    <circle cx="19" cy="12.4" r="1.15" fill="currentColor" stroke="none"/>
    <path d="M13 15.6c1.7 1.6 4.3 1.6 6 0"/>
  </symbol>
</svg>
